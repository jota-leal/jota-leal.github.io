<!doctype html>
<html lang="es">

*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(103,55,181,.24),transparent 34%),radial-gradient(circle at 82% 84%,rgba(20,160,177,.14),transparent 33%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:14px}.shell{position:relative;width:min(97vw,1200px);aspect-ratio:1200/760;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:#090a15;box-shadow:0 30px 100px rgba(0,0,0,.58),inset 0 0 0 1px rgba(255,255,255,.025)}canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}.controls{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;max-width:calc(100% - 22px);padding:6px 11px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(7,8,18,.78);backdrop-filter:blur(12px);color:#c9c5da;font-size:10px;white-space:nowrap;pointer-events:none}.key{display:inline-grid;place-items:center;min-width:21px;height:20px;margin-right:4px;padding:0 5px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:rgba(255,255,255,.06);color:#fff;font-weight:800}@media(max-width:800px){body{padding:0}.shell{width:100vw;border:0;border-radius:0}.controls{bottom:3px;gap:6px;font-size:8px}}
</style>
</head>
<body>

<canvas id="game" width="1200" height="760" aria-label="Prototipo jugable Void Cutter Resonance"></canvas>
<div class="controls">
<span><span class="key">WASD</span>movimiento</span>

</div>
</main>
<script>
(()=>{
"use strict";

const canvas=document.getElementById("game");
const shell=document.getElementById("shell");
const ctx=canvas.getContext("2d",{alpha:false});
const W=canvas.width,H=canvas.height;
const PLAY={x:24,y:104,w:1152,h:592};
const CELL=4,COLS=PLAY.w/CELL,ROWS=PLAY.h/CELL,BORDER=5,REQUIRED_NODES=3;
const TAU=Math.PI*2;
const STATE=Object.freeze({READY:"ready",PLAYING:"playing",PAUSED:"paused",LOST:"lost",CLEARED:"cleared"});
const NODE_TYPES={
 ENERGY:{id:"energy",label:"ENERGÍA",short:"E",color:"#65f2ff",description:"Secuencia de conducción"},
 DEFENSE:{id:"defense",label:"DEFENSA",short:"D",color:"#8affbb",description:"Carga dentro del perímetro"},
 SLOW:{id:"slow",label:"CRONO",short:"C",color:"#a995ff",description:"Ralentiza amenazas"},
 SCORE:{id:"score",label:"RESONANCIA",short:"R",color:"#ffc75f",description:"Multiplica capturas"},
 CLEANSE:{id:"cleanse",label:"PURGA",short:"P",color:"#ff7acb",description:"Limpia corrupción"}
};

const safe=new Uint8Array(COLS*ROWS);
const trail=new Uint8Array(COLS*ROWS);
const labels=new Int32Array(COLS*ROWS);
const bfsQueue=new Int32Array(COLS*ROWS);
const corruptedHistory=[];
const trailCells=[],trailPoints=[],trailEchoes=[],recentTrailCells=[];
const enemies=[],nodes=[],particles=[],spores=[],nodeQueue=[],feedbackTexts=[],reveals=[];
const keys=new Set();
const pointer={down:false,x:PLAY.w/2,y:PLAY.h/2};

function makeCanvas(w=PLAY.w,h=PLAY.h){const c=document.createElement("canvas");c.width=w;c.height=h;return c}
const artCanvas=makeCanvas(),artCtx=artCanvas.getContext("2d");
const overlayCanvas=makeCanvas(),overlayCtx=overlayCanvas.getContext("2d");
const edgeCanvas=makeCanvas(),edgeCtx=edgeCanvas.getContext("2d");
const fogCanvas=makeCanvas(512,512),fogCtx=fogCanvas.getContext("2d");

let state=STATE.READY,level=1,score=0,lives=3,shield=0,capturedPercent=0,combo=1;
let activeTrail=false,lastTrailCell=-1,trailStart={x:BORDER*CELL,y:PLAY.h/2},lastSafePosition={...trailStart};
let captureFlash=0,shake=0,scorePulse=0,captureSummary=null,nodeQueueDelay=0,portal=null,stabilizedCount=0;
let elapsed=0,lastTime=performance.now(),audioCtx=null,sporeTimer=2.4,defensePulseTimer=0;
let anchorActive=false,anchor={x:0,y:0,radius:0,angle:0};
let hudNotice=null;

const powers={energy:0,defense:0,slow:0,score:0,cleanse:0};
const debug={telemetry:false,enemiesEnabled:true};
const telemetry={levelTime:0,captures:0,deaths:0,incursionAttempts:0,incursionSuccess:0,territoryGained:0,nodesStabilized:0,maxCombo:1,totalRisk:0,frames:0,fps:60,fpsClock:0};
const player={x:BORDER*CELL-CELL*.5,y:PLAY.h/2,vx:0,vy:0,r:7,energy:100,invulnerable:0};
const worldCamera={x:PLAY.w/2,y:PLAY.h/2,zoom:1};
const incursion={active:false,mode:"",phase:"idle",transition:0,transitionDuration:.45,presentation:0,presentationDuration:.78,completion:0,completionDuration:.64,node:null,timer:0,duration:9,items:[],hazards:[],waves:[],needed:0,collected:0,nextIndex:0,charge:0,defenseRadius:120,waveTimer:.7,success:false,finalItem:null,view:null,completionBurst:false};

const idx=(c,r)=>r*COLS+c;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function roundedRectPath(c,x,y,w,h,r){const q=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+q,y);c.arcTo(x+w,y,x+w,y+h,q);c.arcTo(x+w,y+h,x,y+h,q);c.arcTo(x,y+h,x,y,q);c.arcTo(x,y,x+w,y,q);c.closePath()}
function gridFromPos(x,y){return{c:clamp(Math.floor(x/CELL),0,COLS-1),r:clamp(Math.floor(y/CELL),0,ROWS-1)}}
function isSafeAt(x,y){const g=gridFromPos(x,y);return safe[idx(g.c,g.r)]===1}
function isTrailAt(x,y){const g=gridFromPos(x,y);return trail[idx(g.c,g.r)]===1}
function circleTouchesSafe(x,y,r){if(isSafeAt(x,y))return true;for(let i=0;i<12;i++){const a=i/12*TAU;if(isSafeAt(x+Math.cos(a)*r,y+Math.sin(a)*r))return true}return false}
function safeDisk(x,y,r){if(x<r+10||y<r+10||x>PLAY.w-r-10||y>PLAY.h-r-10||!isSafeAt(x,y))return false;for(let i=0;i<12;i++){const a=i/12*TAU;if(!isSafeAt(x+Math.cos(a)*r,y+Math.sin(a)*r))return false}return true}
function beginAudio(){if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx?.state==="suspended")audioCtx.resume()}
function beep(freq,duration=.06,volume=.03,type="sine"){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}
function notice(text,color="#65f2ff",life=1.4){hudNotice={text,color,life,max:life}}
function addFeedbackText(x,y,text,color="#fff",size=15,life=.9){feedbackTexts.push({x:clamp(x,85,PLAY.w-85),y:clamp(y,28,PLAY.h-28),text,color,size,life,max:life,vy:-23})}

function createArt(){
 artCtx.clearRect(0,0,PLAY.w,PLAY.h);
 const bg=artCtx.createLinearGradient(0,0,PLAY.w,PLAY.h);bg.addColorStop(0,"#18264b");bg.addColorStop(.5,"#10172d");bg.addColorStop(1,"#07101d");artCtx.fillStyle=bg;artCtx.fillRect(0,0,PLAY.w,PLAY.h);
 artCtx.save();artCtx.translate(PLAY.w*.63,PLAY.h*.51);artCtx.globalAlpha=.18;
 for(let i=0;i<7;i++){artCtx.beginPath();const rx=105+i*43,ry=58+i*28;artCtx.ellipse(0,0,rx,ry,-.18+i*.03,0,TAU);artCtx.strokeStyle=i%2?"#65f2ff":"#ff63ce";artCtx.lineWidth=i%3===0?2:1;artCtx.stroke()}
 artCtx.restore();
 for(let i=0;i<90;i++){const x=Math.random()*PLAY.w,y=Math.random()*PLAY.h,s=rand(.7,2.6);artCtx.fillStyle=Math.random()>.5?"rgba(101,242,255,.24)":"rgba(255,99,206,.18)";artCtx.fillRect(x,y,s,s)}
 const v=artCtx.createRadialGradient(PLAY.w/2,PLAY.h/2,180,PLAY.w/2,PLAY.h/2,720);v.addColorStop(.48,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(1,3,12,.72)");artCtx.fillStyle=v;artCtx.fillRect(0,0,PLAY.w,PLAY.h)
}
function createFog(){
 fogCtx.clearRect(0,0,512,512);
 for(let i=0;i<12;i++){const x=rand(20,492),y=rand(20,492),r=rand(55,145),g=fogCtx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,i%2?"rgba(94,104,255,.15)":"rgba(75,232,255,.12)");g.addColorStop(1,"rgba(0,0,0,0)");fogCtx.fillStyle=g;fogCtx.fillRect(x-r,y-r,r*2,r*2)}
}
function drawFog(){const t=(performance.now()*.012)%512;ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.22;for(let y=-512;y<PLAY.h+512;y+=512)for(let x=-512;x<PLAY.w+512;x+=512)ctx.drawImage(fogCanvas,x+t*.35,y-t*.12);ctx.restore()}

function resetTelemetry(){telemetry.levelTime=0;telemetry.captures=0;telemetry.deaths=0;telemetry.incursionAttempts=0;telemetry.incursionSuccess=0;telemetry.territoryGained=0;telemetry.nodesStabilized=0;telemetry.maxCombo=1;telemetry.totalRisk=0;telemetry.frames=0;telemetry.fps=60;telemetry.fpsClock=0}
function resetPowers(){for(const k of Object.keys(powers))powers[k]=0;shield=0;stabilizedCount=0;portal=null;nodeQueue.length=0;nodeQueueDelay=0;defensePulseTimer=0}
function clearTrail(){for(const id of trailCells)trail[id]=0;trailCells.length=0;trailPoints.length=0;recentTrailCells.length=0;activeTrail=false;lastTrailCell=-1;anchorActive=false}
function resetTerritory(){
 safe.fill(0);trail.fill(0);corruptedHistory.length=0;reveals.length=0;clearTrail();feedbackTexts.length=0;trailEchoes.length=0;captureSummary=null;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(c<BORDER||r<BORDER||c>=COLS-BORDER||r>=ROWS-BORDER)safe[idx(c,r)]=1;
 player.x=BORDER*CELL-CELL*.5;player.y=PLAY.h/2;player.vx=player.vy=0;player.energy=getMaxEnergy();player.invulnerable=1;lastSafePosition={x:player.x,y:player.y};trailStart={...lastSafePosition};updateCapturedPercent();rebuildOverlay();rebuildEdges()
}
function rebuildOverlay(){
 overlayCtx.clearRect(0,0,PLAY.w,PLAY.h);overlayCtx.fillStyle="rgba(5,7,19,.91)";
 for(let r=0;r<ROWS;r++){let run=-1;for(let c=0;c<=COLS;c++){const dark=c<COLS&&safe[idx(c,r)]===0;if(dark&&run<0)run=c;if((!dark||c===COLS)&&run>=0){overlayCtx.fillRect(run*CELL,r*CELL,(c-run)*CELL,CELL);run=-1}}}
 const s=overlayCtx.createLinearGradient(0,0,PLAY.w,PLAY.h);s.addColorStop(0,"rgba(75,42,133,.12)");s.addColorStop(.55,"rgba(0,0,0,0)");s.addColorStop(1,"rgba(10,111,124,.10)");overlayCtx.fillStyle=s;overlayCtx.fillRect(0,0,PLAY.w,PLAY.h)
}
function rebuildEdges(){
 edgeCtx.clearRect(0,0,PLAY.w,PLAY.h);edgeCtx.save();edgeCtx.beginPath();
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(!safe[idx(c,r)])continue;const x=c*CELL,y=r*CELL;if(c<COLS-1&&!safe[idx(c+1,r)]){edgeCtx.moveTo(x+CELL,y);edgeCtx.lineTo(x+CELL,y+CELL)}if(r<ROWS-1&&!safe[idx(c,r+1)]){edgeCtx.moveTo(x,y+CELL);edgeCtx.lineTo(x+CELL,y+CELL)}if(c>0&&!safe[idx(c-1,r)]){edgeCtx.moveTo(x,y);edgeCtx.lineTo(x,y+CELL)}if(r>0&&!safe[idx(c,r-1)]){edgeCtx.moveTo(x,y);edgeCtx.lineTo(x+CELL,y)}}
 edgeCtx.lineCap="round";edgeCtx.lineJoin="round";edgeCtx.shadowBlur=9;edgeCtx.shadowColor="rgba(101,242,255,.62)";edgeCtx.strokeStyle="rgba(122,245,255,.78)";edgeCtx.lineWidth=1;edgeCtx.stroke();edgeCtx.restore()
}
function updateCapturedPercent(){let claimed=0,total=0;for(let r=BORDER;r<ROWS-BORDER;r++)for(let c=BORDER;c<COLS-BORDER;c++){total++;if(safe[idx(c,r)])claimed++}capturedPercent=total?claimed/total*100:0}
function createReveal(cellIds,originX,originY){
 if(!cellIds.length)return;const cover=makeCanvas(),cc=cover.getContext("2d"),frame=makeCanvas(),fc=frame.getContext("2d");cc.fillStyle="rgba(5,7,19,.96)";let maxDistance=1;
 const rows=new Map();for(const id of cellIds){const c=id%COLS,r=(id/COLS)|0;if(!rows.has(r))rows.set(r,[]);rows.get(r).push(c);const x=c*CELL+CELL*.5,y=r*CELL+CELL*.5;maxDistance=Math.max(maxDistance,Math.hypot(x-originX,y-originY))}
 for(const [r,cols] of rows){cols.sort((a,b)=>a-b);let start=cols[0],last=start;for(let i=1;i<=cols.length;i++){const c=cols[i];if(c===last+1){last=c;continue}cc.fillRect(start*CELL-5,r*CELL-5,(last-start+1)*CELL+10,CELL+10);start=c;last=c}}
 reveals.push({cover,frame,fc,originX,originY,maxDistance,progress:0,duration:.56})
}
function updateReveals(dt){for(let i=reveals.length-1;i>=0;i--){const r=reveals[i];r.progress=Math.min(1,r.progress+dt/r.duration);if(r.progress>=1)reveals.splice(i,1)}}
function drawReveals(){
 for(const r of reveals){const e=1-Math.pow(1-r.progress,3),radius=e*r.maxDistance,feather=38;r.fc.clearRect(0,0,PLAY.w,PLAY.h);r.fc.globalCompositeOperation="source-over";r.fc.drawImage(r.cover,0,0);r.fc.globalCompositeOperation="destination-out";const g=r.fc.createRadialGradient(r.originX,r.originY,Math.max(0,radius-feather),r.originX,r.originY,radius+feather);g.addColorStop(0,"rgba(0,0,0,1)");g.addColorStop(1,"rgba(0,0,0,0)");r.fc.fillStyle=g;r.fc.fillRect(0,0,PLAY.w,PLAY.h);r.fc.globalCompositeOperation="source-over";ctx.drawImage(r.frame,0,0);ctx.save();ctx.strokeStyle=`rgba(101,242,255,${(1-r.progress)*.58})`;ctx.lineWidth=2;ctx.shadowBlur=18;ctx.shadowColor="#65f2ff";ctx.beginPath();ctx.arc(r.originX,r.originY,radius,0,TAU);ctx.stroke();ctx.restore()}
}

function randomUnclaimedPosition(margin=45){for(let i=0;i<3500;i++){const x=rand(BORDER*CELL+margin,PLAY.w-BORDER*CELL-margin),y=rand(BORDER*CELL+margin,PLAY.h-BORDER*CELL-margin);if(!isSafeAt(x,y)&&!isTrailAt(x,y))return{x,y}}return{x:PLAY.w*.7,y:PLAY.h*.5}}
function randomSafePositionNear(origin,maxDistance=190){for(let i=0;i<1800;i++){const a=Math.random()*TAU,d=rand(28,maxDistance),x=clamp(origin.x+Math.cos(a)*d,12,PLAY.w-12),y=clamp(origin.y+Math.sin(a)*d,12,PLAY.h-12);if(safeDisk(x,y,6))return{x,y}}return{x:origin.x,y:origin.y}}
function createNodes(){nodes.length=0;const types=Object.values(NODE_TYPES),anchors=[{x:.23,y:.25},{x:.48,y:.2},{x:.76,y:.28},{x:.37,y:.72},{x:.7,y:.73}];types.forEach((type,i)=>nodes.push({x:clamp(anchors[i].x*PLAY.w+rand(-42,42),82,PLAY.w-82),y:clamp(anchors[i].y*PLAY.h+rand(-32,32),66,PLAY.h-66),r:15,type,status:"dormant",phase:Math.random()*TAU,retryTimer:0}))}
function makeEnemy(kind,x,y){const a=Math.random()*TAU,s=kind==="core"?72:kind==="corruptor"?58:rand(88,116);return{kind,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:kind==="core"?14:kind==="corruptor"?12:rand(7,10),phase:Math.random()*TAU}}
function spawnEnemies(){enemies.length=0;let p=randomUnclaimedPosition(100);enemies.push(makeEnemy("core",p.x,p.y));for(let i=0;i<2+Math.min(3,level);i++){p=randomUnclaimedPosition();enemies.push(makeEnemy("hunter",p.x,p.y))}p=randomUnclaimedPosition(80);enemies.push(makeEnemy("corruptor",p.x,p.y))}
function getMaxEnergy(){return 100+powers.energy*35}
function getEnemyTimeScale(){return Math.max(.55,1-powers.slow*.18)}
function getScoreMultiplier(){return 1+powers.score*.5}

function resetIncursion(){incursion.active=false;incursion.mode="";incursion.phase="idle";incursion.transition=0;incursion.presentation=0;incursion.completion=0;incursion.node=null;incursion.timer=0;incursion.items.length=0;incursion.hazards.length=0;incursion.waves.length=0;incursion.needed=0;incursion.collected=0;incursion.nextIndex=0;incursion.charge=0;incursion.success=false;incursion.finalItem=null;incursion.view=null;incursion.completionBurst=false}
function resetGame(full=true){if(full){level=1;score=0;lives=3;combo=1;elapsed=0}particles.length=0;spores.length=0;resetIncursion();resetPowers();resetTelemetry();resetTerritory();createNodes();spawnEnemies();sporeTimer=2.4;state=STATE.PLAYING;beep(440,.06,.035)}
function nextLevel(){level++;lives=Math.min(5,lives+1);particles.length=0;spores.length=0;resetIncursion();resetPowers();resetTelemetry();resetTerritory();createNodes();spawnEnemies();sporeTimer=2.4;state=STATE.PLAYING;beep(680,.09,.045)}

function rasterLine(c0,r0,c1,r1,fn){let dx=Math.abs(c1-c0),sx=c0<c1?1:-1,dy=-Math.abs(r1-r0),sy=r0<r1?1:-1,err=dx+dy;while(true){fn(c0,r0);if(c0===c1&&r0===r1)break;const e2=2*err;if(e2>=dy){err+=dy;c0+=sx}if(e2<=dx){err+=dx;r0+=sy}}}
function drawTrailSegment(x0,y0,x1,y1){const a=gridFromPos(x0,y0),b=gridFromPos(x1,y1);let crossed=false;rasterLine(a.c,a.r,b.c,b.r,(c,r)=>{if(c<0||r<0||c>=COLS||r>=ROWS)return;const id=idx(c,r);if(safe[id])return;if(trail[id]&&!recentTrailCells.includes(id))crossed=true;if(!trail[id]){trail[id]=1;trailCells.push(id)}lastTrailCell=id;recentTrailCells.push(id);if(recentTrailCells.length>8)recentTrailCells.shift()});return crossed}
function appendTrailPoint(x,y,force=false){const last=trailPoints[trailPoints.length-1];if(!last||force||Math.hypot(x-last.x,y-last.y)>=2.2)trailPoints.push({x,y});else{last.x=x;last.y=y}}
function smoothPath(c,pts){if(!pts||pts.length<2)return false;c.beginPath();c.moveTo(pts[0].x,pts[0].y);if(pts.length===2){c.lineTo(pts[1].x,pts[1].y);return true}for(let i=1;i<pts.length-1;i++){const p=pts[i],n=pts[i+1];c.quadraticCurveTo(p.x,p.y,(p.x+n.x)*.5,(p.y+n.y)*.5)}const l=pts[pts.length-1];c.lineTo(l.x,l.y);return true}
function commitTrailEcho(color="#65f2ff",duration=.3){if(trailPoints.length<2)return;trailEchoes.push({points:trailPoints.map(p=>({...p})),color,life:duration,max:duration})}

function labelComponents(){labels.fill(-1);const sizes=[];let label=0;for(let seed=0;seed<safe.length;seed++){if(safe[seed]||trail[seed]||labels[seed]!==-1)continue;let head=0,tail=0;labels[seed]=label;bfsQueue[tail++]=seed;let size=0;while(head<tail){const cur=bfsQueue[head++],c=cur%COLS,r=(cur/COLS)|0;size++;const visit=id=>{if(id>=0&&id<labels.length&&!safe[id]&&!trail[id]&&labels[id]===-1){labels[id]=label;bfsQueue[tail++]=id}};if(c>0)visit(cur-1);if(c<COLS-1)visit(cur+1);if(r>0)visit(cur-COLS);if(r<ROWS-1)visit(cur+COLS)}sizes[label++]=size}return sizes}
function captureTerritory(){
 const origin={x:player.x,y:player.y},previous=capturedPercent,sizes=labelComponents();let preserve=-1;
 if(debug.enemiesEnabled){const core=enemies.find(e=>e.kind==="core");if(core){const g=gridFromPos(core.x,core.y);preserve=labels[idx(g.c,g.r)]}}
 if(preserve<0&&sizes.length){let best=-1;for(let i=0;i<sizes.length;i++)if(sizes[i]>best){best=sizes[i];preserve=i}}
 const captured=[];for(let i=0;i<safe.length;i++){if(trail[i]||(!safe[i]&&labels[i]!==preserve)){if(!safe[i])captured.push(i);safe[i]=1}}

 ctx.restore()}
function drawTelemetry(){if(!debug.telemetry)return;const success=telemetry.incursionAttempts?telemetry.incursionSuccess/telemetry.incursionAttempts*100:0,x=PLAY.w-267,y=PLAY.h-150;ctx.save();ctx.fillStyle="rgba(5,7,18,.9)";roundedRectPath(ctx,x,y,250,134,12);ctx.fill();ctx.strokeStyle="rgba(101,242,255,.35)";ctx.stroke();ctx.fillStyle="#65f2ff";ctx.font="800 11px Inter,system-ui";ctx.fillText("TELEMETRÍA · F2",x+14,y+18);ctx.fillStyle="#c9c5da";ctx.font="600 10px ui-monospace,monospace";const rows=[`TIEMPO       ${telemetry.levelTime.toFixed(1)} s`,`CAPTURAS     ${telemetry.captures}`,`MUERTES      ${telemetry.deaths}`,`INCURSIONES  ${telemetry.incursionSuccess}/${telemetry.incursionAttempts} (${success.toFixed(0)}%)`,`COMBO MÁX.   ×${telemetry.maxCombo.toFixed(1)}`,`FPS          ${telemetry.fps}`,`ENEMIGOS     ${debug.enemiesEnabled?"ON":"OFF"}`];rows.forEach((t,i)=>ctx.fillText(t,x+14,y+38+i*14));ctx.restore()}
function drawModal(){ctx.save();ctx.fillStyle="rgba(3,4,12,.68)";ctx.fillRect(0,0,W,H);const box={x:W/2-280,y:H/2-160,w:560,h:320};ctx.fillStyle="rgba(15,16,34,.96)";roundedRectPath(ctx,box.x,box.y,box.w,box.h,22);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.13)";ctx.stroke();ctx.textAlign="center";ctx.textBaseline="middle";let title="VOID CUTTER: RESONANCE",sub="Cortá el vacío, estabilizá tres nodos y escapá por el portal.",button="INICIAR PROTOCOLO",accent="#65f2ff";if(state===STATE.PAUSED){title="PAUSA";sub="El campo está completamente congelado.";button="CONTINUAR";accent="#ffc75f"}else if(state===STATE.LOST){title="RED COLAPSADA";sub=`Puntaje final: ${score.toLocaleString("es-AR")}`;button="REINICIAR";accent="#ff688f"}else if(state===STATE.CLEARED){title="RUTA ESTABILIZADA";sub=`${stabilizedCount} nodos · ${capturedPercent.toFixed(1)}% reconstruido`;button="SIGUIENTE SECTOR";accent="#ffc75f"}ctx.fillStyle=accent;ctx.font="900 30px Inter,system-ui";ctx.fillText(title,W/2,box.y+58);ctx.fillStyle="#c5c1d5";ctx.font="500 14px Inter,system-ui";ctx.fillText(sub,W/2,box.y+100);if(state===STATE.READY){ctx.fillStyle="#9692aa";ctx.font="500 11px Inter,system-ui";ctx.fillText("ENERGÍA: seguí una cadena en orden. DEFENSA: cargá el perímetro y atravesá las brechas.",W/2,box.y+135);ctx.fillText("F2 muestra telemetría. F3 oculta y desactiva los enemigos del nivel principal.",W/2,box.y+156)}ctx.fillStyle=accent;roundedRectPath(ctx,W/2-126,box.y+220,252,52,12);ctx.fill();ctx.fillStyle="#080914";ctx.font="900 13px Inter,system-ui";ctx.fillText(`${button} · ENTER`,W/2,box.y+246);ctx.restore()}
function draw(){drawBackground();drawHud();ctx.save();const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;ctx.translate(PLAY.x+sx,PLAY.y+sy);ctx.save();roundedRectPath(ctx,0,0,PLAY.w,PLAY.h,15);ctx.clip();ctx.save();applyCamera(ctx);ctx.drawImage(artCanvas,0,0);ctx.drawImage(overlayCanvas,0,0);drawFog();ctx.drawImage(edgeCanvas,0,0);drawReveals();drawNodes();drawPortal();drawSpores();drawTrail();drawAnchor();drawParticles();drawFeedback();if(!incursion.active)drawEnemies();drawIncursion();drawPlayer();ctx.restore();drawTelemetry();if(captureFlash>0){ctx.fillStyle=`rgba(110,245,255,${captureFlash*.12})`;ctx.fillRect(0,0,PLAY.w,PLAY.h)}ctx.restore();ctx.strokeStyle="rgba(255,255,255,.16)";ctx.lineWidth=1.5;roundedRectPath(ctx,0,0,PLAY.w,PLAY.h,15);ctx.stroke();ctx.restore();if(state!==STATE.PLAYING)drawModal()}

function resumeOrStart(){beginAudio();if(state===STATE.READY||state===STATE.LOST)resetGame(true);else if(state===STATE.CLEARED)nextLevel();else if(state===STATE.PAUSED){state=STATE.PLAYING;lastTime=performance.now()}}
function pointerToGame(ev){const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;return{x:(ev.clientX-r.left)*sx-PLAY.x,y:(ev.clientY-r.top)*sy-PLAY.y}}
function toggleEnemies(){debug.enemiesEnabled=!debug.enemiesEnabled;spores.length=0;if(debug.enemiesEnabled)relocateTrappedEnemies();notice(debug.enemiesEnabled?"DEBUG · ENEMIGOS ACTIVADOS":"DEBUG · ENEMIGOS DESACTIVADOS","#ffc75f",1.6)}
async function toggleFullscreen(){try{if(!document.fullscreenElement)await shell.requestFullscreen();else await document.exitFullscreen()}catch{notice("EL NAVEGADOR BLOQUEÓ PANTALLA COMPLETA","#ff688f")}}
window.addEventListener("keydown",ev=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(ev.code))ev.preventDefault();if(ev.code==="Enter"&&state!==STATE.PLAYING){resumeOrStart();return}if(ev.code==="KeyP"){if(state===STATE.PLAYING)state=STATE.PAUSED;else if(state===STATE.PAUSED)resumeOrStart();return}if(ev.code==="KeyR"){resetGame(true);return}if(ev.code==="KeyQ"&&!ev.repeat){toggleAnchor();return}if(ev.code==="F2"&&!ev.repeat){debug.telemetry=!debug.telemetry;notice(debug.telemetry?"TELEMETRÍA VISIBLE":"TELEMETRÍA OCULTA");return}if(ev.code==="F3"&&!ev.repeat){toggleEnemies();return}if(ev.code==="KeyF"&&!ev.repeat){toggleFullscreen();return}keys.add(ev.code)});
window.addEventListener("keyup",ev=>keys.delete(ev.code));window.addEventListener("blur",()=>{keys.clear();pointer.down=false;if(state===STATE.PLAYING)state=STATE.PAUSED});canvas.addEventListener("pointerdown",ev=>{beginAudio();if(state!==STATE.PLAYING){resumeOrStart();return}const p=pointerToGame(ev);pointer.x=clamp(p.x,0,PLAY.w);pointer.y=clamp(p.y,0,PLAY.h);pointer.down=true;canvas.setPointerCapture?.(ev.pointerId)});canvas.addEventListener("pointermove",ev=>{const p=pointerToGame(ev);pointer.x=clamp(p.x,0,PLAY.w);pointer.y=clamp(p.y,0,PLAY.h)});canvas.addEventListener("pointerup",ev=>{pointer.down=false;canvas.releasePointerCapture?.(ev.pointerId)});canvas.addEventListener("pointercancel",()=>pointer.down=false);canvas.addEventListener("contextmenu",ev=>ev.preventDefault());
window.voidCutterDebug={toggleEnemies,toggleTelemetry:()=>debug.telemetry=!debug.telemetry,getTelemetry:()=>({...telemetry,incursionSuccessRate:telemetry.incursionAttempts?telemetry.incursionSuccess/telemetry.incursionAttempts:0}),state:()=>({state,level,score,lives,capturedPercent,debug:{...debug}})};
function frame(now){const dt=Math.min(.033,(now-lastTime)/1000||0);lastTime=now;update(dt);draw();requestAnimationFrame(frame)}
createArt();createFog();resetPowers();resetTerritory();createNodes();spawnEnemies();requestAnimationFrame(frame);
})();
</script>
