name: Export Void Cutter Standalone

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone V4
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path("void-cutter/void_cutter_resonance_v3.html")
          out_dir = Path("dist")
          out_dir.mkdir(exist_ok=True)
          target = out_dir / "void_cutter_resonance_v4_standalone.html"
          text = source.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "<title>VOID CUTTER: Resonance — V3 consolidada</title>",
              "<title>VOID CUTTER: Resonance — V4 standalone</title>",
              "title",
          )

          replace_once(
              'const trailCells=[],trailPoints=[],trailEchoes=[],recentTrailCells=[];',
              'const trailCells=[],trailPoints=[],trailEchoes=[],recentTrailCells=[],playerWake=[];\nconst MAX_WAKE_POINTS=30;',
              "wake storage",
          )

          replace_once(
              'safe.fill(0);trail.fill(0);corruptedHistory.length=0;reveals.length=0;clearTrail();feedbackTexts.length=0;trailEchoes.length=0;captureSummary=null;',
              'safe.fill(0);trail.fill(0);corruptedHistory.length=0;reveals.length=0;clearTrail();playerWake.length=0;feedbackTexts.length=0;trailEchoes.length=0;captureSummary=null;',
              "wake reset",
          )

          replace_once(
              'function failIncursion(){if(!incursion.active||incursion.phase!=="active")return;const n=incursion.node;n.status="retry";n.retryTimer=3;combo=Math.max(1,combo-.5);incursion.success=false;incursion.phase="exiting";incursion.transition=0;addFeedbackText(n.x,n.y-31,"RESONANCIA INESTABLE","#ff688f",13,1.05);beep(160,.2,.05,"sawtooth")}',
              '''function failIncursion(){
 if(!incursion.active||incursion.phase!=="active")return;
 const n=incursion.node;
 n.status="lost";
 n.retryTimer=0;
 combo=Math.max(1,combo-.5);
 incursion.success=false;
 incursion.phase="exiting";
 incursion.transition=0;
 addFeedbackText(n.x,n.y-31,"NODO PERDIDO","#ff688f",13,1.1);
 notice("INCURSIÓN PERDIDA · EL NODO QUEDÓ INACTIVO","#ff688f",1.8);
 spawnBurst(n.x,n.y,"#ff688f",34);
 beep(160,.2,.05,"sawtooth")
}''',
              "lost incursion state",
          )

          wake_code = r'''function updatePlayerWake(dt){
 for(let i=playerWake.length-1;i>=0;i--){
  playerWake[i].age+=dt;
  if(playerWake[i].age>.62)playerWake.splice(i,1)
 }
 const speed=Math.hypot(player.vx,player.vy);
 if(speed<12)return;
 const last=playerWake[0];
 if(!last||Math.hypot(player.x-last.x,player.y-last.y)>=3.25){
  playerWake.unshift({x:player.x,y:player.y,age:0,speed});
  if(playerWake.length>MAX_WAKE_POINTS)playerWake.length=MAX_WAKE_POINTS
 }
}
function getWakePalette(){
 const boosting=keys.has("Space")&&player.energy>0&&Math.hypot(player.vx,player.vy)>24;
 if(boosting)return{glow:"rgba(184,255,101,.12)",main:"rgba(184,255,101,.55)",core:"rgba(239,255,203,.96)"};
 if(activeTrail)return{glow:"rgba(255,99,206,.12)",main:"rgba(255,99,206,.5)",core:"rgba(255,229,249,.96)"};
 return{glow:"rgba(101,242,255,.1)",main:"rgba(101,242,255,.46)",core:"rgba(226,255,255,.96)"}
}
function drawPlayerWake(){
 if(playerWake.length<2)return;
 const palette=getWakePalette();
 ctx.save();
 ctx.globalCompositeOperation="lighter";
 ctx.lineCap="round";
 ctx.lineJoin="round";
 for(let i=playerWake.length-1;i>0;i--){
  const older=playerWake[i],newer=playerWake[i-1];
  const alpha=clamp(1-older.age/.62,0,1);
  const width=lerp(1.2,5.6,alpha);
  ctx.beginPath();ctx.moveTo(older.x,older.y);ctx.lineTo(newer.x,newer.y);
  ctx.globalAlpha=alpha*.34;ctx.shadowBlur=18;ctx.shadowColor=palette.main;ctx.strokeStyle=palette.glow;ctx.lineWidth=width*2.4;ctx.stroke();
  ctx.globalAlpha=alpha*.72;ctx.shadowBlur=9;ctx.strokeStyle=palette.main;ctx.lineWidth=width;ctx.stroke();
  ctx.globalAlpha=alpha*.92;ctx.shadowBlur=0;ctx.strokeStyle=palette.core;ctx.lineWidth=Math.max(.7,width*.23);ctx.stroke()
 }
 for(let i=0;i<Math.min(6,playerWake.length);i++){
  const p=playerWake[i],a=clamp(1-p.age/.62,0,1)*(1-i/7);
  ctx.globalAlpha=a*.75;ctx.fillStyle=palette.core;
  ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.1,3.5-i*.42),0,TAU);ctx.fill()
 }
 ctx.restore()
}
'''

          marker = 'function drawTrail(){'
          if text.count(marker) != 1:
              raise RuntimeError("drawTrail marker missing")
          text = text.replace(marker, wake_code + marker, 1)

          old_nodes = 'function drawNodes(){for(const n of nodes){ctx.save();ctx.translate(n.x,n.y);const stable=n.status==="stabilized",queued=n.status==="queued",inc=n.status==="incursion",retry=n.status==="retry",pulse=1+Math.sin(n.phase)*.08;ctx.globalAlpha=stable||inc?1:.78;ctx.strokeStyle=retry?"#ff688f":queued?"#ffc75f":n.type.color;ctx.lineWidth=stable?2.2:queued||inc?1.8:1.2;ctx.shadowBlur=stable||inc?22:queued?17:10;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();ctx.arc(0,0,n.r*pulse,0,TAU);ctx.stroke();ctx.rotate(Math.PI/4);ctx.fillStyle=stable?n.type.color:"rgba(255,255,255,.035)";ctx.strokeRect(-8,-8,16,16);if(stable)ctx.fillRect(-5,-5,10,10);ctx.rotate(-Math.PI/4);ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font="900 9px Inter,system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(n.type.short,0,0);ctx.restore()}}'
          new_nodes = '''function drawNodes(){
 for(const n of nodes){
  ctx.save();ctx.translate(n.x,n.y);
  const stable=n.status==="stabilized",queued=n.status==="queued",inc=n.status==="incursion",lost=n.status==="lost";
  const pulse=lost?1:1+Math.sin(n.phase)*.08;
  ctx.globalAlpha=lost?.42:(stable||inc?1:.78);
  ctx.strokeStyle=lost?"#6d667d":queued?"#ffc75f":n.type.color;
  ctx.lineWidth=stable?2.2:queued||inc?1.8:1.2;
  ctx.shadowBlur=lost?0:stable||inc?22:queued?17:10;
  ctx.shadowColor=ctx.strokeStyle;
  if(lost){
   ctx.setLineDash([4,5]);
   ctx.beginPath();ctx.arc(0,0,n.r*pulse,-Math.PI*.15,Math.PI*.62);ctx.stroke();
   ctx.beginPath();ctx.arc(0,0,n.r*pulse,Math.PI*.84,Math.PI*1.7);ctx.stroke();
   ctx.setLineDash([])
  }else{
   ctx.beginPath();ctx.arc(0,0,n.r*pulse,0,TAU);ctx.stroke()
  }
  ctx.rotate(Math.PI/4);ctx.fillStyle=stable?n.type.color:"rgba(255,255,255,.035)";ctx.strokeRect(-8,-8,16,16);if(stable)ctx.fillRect(-5,-5,10,10);ctx.rotate(-Math.PI/4);
  ctx.shadowBlur=0;ctx.textAlign="center";ctx.textBaseline="middle";
  if(lost){
   ctx.strokeStyle="#ff688f";ctx.lineWidth=1.4;
   ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(4,4);ctx.moveTo(4,-4);ctx.lineTo(-4,4);ctx.stroke()
  }else{
   ctx.fillStyle="#fff";ctx.font="900 9px Inter,system-ui";ctx.fillText(n.type.short,0,0)
  }
  ctx.restore()
 }
}'''
          replace_once(old_nodes, new_nodes, "lost node drawing")

          replace_once(
              'if(incursion.active){updateIncursion(dt);return}',
              'if(incursion.active){updateIncursion(dt);updatePlayerWake(dt);return}',
              "wake during incursions",
          )
          replace_once(
              'updatePlayer(dt);updateEnemies(dt);',
              'updatePlayer(dt);updatePlayerWake(dt);updateEnemies(dt);',
              "wake during world play",
          )
          replace_once(
              'drawNodes();drawPortal();drawSpores();drawTrail();drawAnchor();',
              'drawNodes();drawPortal();drawSpores();drawPlayerWake();drawTrail();drawAnchor();',
              "wake render order",
          )

          # Explicit safeguard: only dormant nodes can ever enter the queue.
          if 'n.status==="dormant"&&isSafeAt(n.x,n.y)' not in text:
              raise RuntimeError("dormant-only node queue guard missing")

          target.write_text(text, encoding="utf-8")

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('dist/void_cutter_resonance_v4_standalone.html').read_text(encoding='utf-8')
          match=re.search(r'<script>([\s\S]*?)</script>',html)
          if not match: raise SystemExit('script block not found')
          Path('/tmp/void-cutter.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/void-cutter.js

      - uses: actions/upload-artifact@v4
        with:
          name: void-cutter-v4-standalone
          path: dist/void_cutter_resonance_v4_standalone.html
          if-no-files-found: error
