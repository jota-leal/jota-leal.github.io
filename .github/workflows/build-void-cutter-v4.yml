name: Build Void Cutter V4

on:
  push:
    branches:
      - void-cutter-v3-preview
    paths:
      - .github/workflows/build-void-cutter-v4.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: void-cutter-v3-preview

      - name: Build corrected standalone HTML
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path("void-cutter/void_cutter_resonance_v3.html")
          target = Path("void-cutter/void_cutter_resonance_v4.html")
          text = source.read_text(encoding="utf-8")

          text = text.replace(
              "<title>VOID CUTTER: Resonance — V3 consolidada</title>",
              "<title>VOID CUTTER: Resonance — V4</title>",
              1,
          )

          # Add persistent live endpoint for the cut trail and a separate player wake.
          text = text.replace(
              'const trailCells=[],trailPoints=[],trailEchoes=[],recentTrailCells=[];',
              'const trailCells=[],trailPoints=[],trailEchoes=[],recentTrailCells=[],playerWake=[];\nconst MAX_WAKE_POINTS=30;',
              1,
          )

          if 'const trailLivePoint=' not in text:
              text = text.replace(
                  'const pointer={down:false,x:PLAY.w/2,y:PLAY.h/2};',
                  'const pointer={down:false,x:PLAY.w/2,y:PLAY.h/2};\nconst trailLivePoint={x:0,y:0,active:false};',
                  1,
              )

          text = re.sub(
              r'function clearTrail\(\)\{[^\n]*\}',
              'function clearTrail(){for(const id of trailCells)trail[id]=0;trailCells.length=0;trailPoints.length=0;recentTrailCells.length=0;trailLivePoint.active=false;activeTrail=false;lastTrailCell=-1;anchorActive=false}',
              text,
              count=1,
          )

          # Replace the entire sampling section, regardless of whether the previous patch ran.
          text = re.sub(
              r'function appendTrailPoint\(x,y,force=false\)\{.*?\}\n(?:function getTrailVisualPoints\(\)\{.*?\}\n)?(?=function smoothPath)',
              '''function appendTrailPoint(x,y,force=false){
 trailLivePoint.x=x;trailLivePoint.y=y;trailLivePoint.active=true;
 const last=trailPoints[trailPoints.length-1];
 if(!last||force||Math.hypot(x-last.x,y-last.y)>=1.65)trailPoints.push({x,y})
}
function getTrailVisualPoints(){
 const points=trailPoints.slice();
 if(trailLivePoint.active){
  const last=points[points.length-1];
  if(!last||Math.hypot(trailLivePoint.x-last.x,trailLivePoint.y-last.y)>.01)points.push({x:trailLivePoint.x,y:trailLivePoint.y})
 }
 return points
}
''',
              text,
              count=1,
              flags=re.S,
          )

          text = re.sub(
              r'function commitTrailEcho\(color="#65f2ff",duration=\.3\)\{[^\n]*\}',
              'function commitTrailEcho(color="#65f2ff",duration=.3){const points=getTrailVisualPoints();if(points.length<2)return;trailEchoes.push({points:points.map(p=>({...p})),color,life:duration,max:duration})}',
              text,
              count=1,
          )

          # A failed incursion becomes a permanent lost state for this level.
          text = re.sub(
              r'function failIncursion\(\)\{.*?\}\n(?=function completeIncursionSuccess)',
              '''function failIncursion(){
 if(!incursion.active||incursion.phase!=="active")return;
 const n=incursion.node;
 n.status="lost";
 n.retryTimer=0;
 combo=Math.max(1,combo-.5);
 incursion.success=false;
 incursion.phase="exiting";
 incursion.transition=0;
 addFeedbackText(n.x,n.y-31,"NODO PERDIDO","#ff688f",13,1.1);
 notice("INCURSIÓN PERDIDA · EL NODO QUEDÓ INACTIVO","#ff688f",1.8);
 spawnBurst(n.x,n.y,"#ff688f",34);
 beep(160,.2,.05,"sawtooth")
}
''',
              text,
              count=1,
              flags=re.S,
          )

          # Keep reset clean.
          text = text.replace(
              'safe.fill(0);trail.fill(0);corruptedHistory.length=0;reveals.length=0;clearTrail();feedbackTexts.length=0;',
              'safe.fill(0);trail.fill(0);corruptedHistory.length=0;reveals.length=0;clearTrail();playerWake.length=0;feedbackTexts.length=0;',
              1,
          )

          wake_and_trail = r'''function updatePlayerWake(dt){
 for(let i=playerWake.length-1;i>=0;i--){playerWake[i].age+=dt;if(playerWake[i].age>.62)playerWake.splice(i,1)}
 const speed=Math.hypot(player.vx,player.vy);
 if(speed<12)return;
 const last=playerWake[0];
 if(!last||Math.hypot(player.x-last.x,player.y-last.y)>=3.25){
  playerWake.unshift({x:player.x,y:player.y,age:0,speed});
  if(playerWake.length>MAX_WAKE_POINTS)playerWake.length=MAX_WAKE_POINTS
 }
}
function getWakePalette(){
 const boosting=keys.has("Space")&&player.energy>0&&Math.hypot(player.vx,player.vy)>24;
 if(boosting)return{glow:"rgba(184,255,101,.12)",main:"rgba(184,255,101,.55)",core:"rgba(239,255,203,.96)"};
 if(activeTrail)return{glow:"rgba(255,99,206,.12)",main:"rgba(255,99,206,.5)",core:"rgba(255,229,249,.96)"};
 return{glow:"rgba(101,242,255,.1)",main:"rgba(101,242,255,.46)",core:"rgba(226,255,255,.96)"}
}
function drawPlayerWake(){
 if(playerWake.length<2)return;
 const palette=getWakePalette();
 ctx.save();ctx.globalCompositeOperation="lighter";ctx.lineCap="round";ctx.lineJoin="round";
 for(let i=playerWake.length-1;i>0;i--){
  const older=playerWake[i],newer=playerWake[i-1],alpha=clamp(1-older.age/.62,0,1),width=lerp(1.2,5.6,alpha);
  ctx.beginPath();ctx.moveTo(older.x,older.y);ctx.lineTo(newer.x,newer.y);
  ctx.globalAlpha=alpha*.34;ctx.shadowBlur=18;ctx.shadowColor=palette.main;ctx.strokeStyle=palette.glow;ctx.lineWidth=width*2.4;ctx.stroke();
  ctx.globalAlpha=alpha*.72;ctx.shadowBlur=9;ctx.strokeStyle=palette.main;ctx.lineWidth=width;ctx.stroke();
  ctx.globalAlpha=alpha*.92;ctx.shadowBlur=0;ctx.strokeStyle=palette.core;ctx.lineWidth=Math.max(.7,width*.23);ctx.stroke()
 }
 for(let i=0;i<Math.min(6,playerWake.length);i++){
  const p=playerWake[i],a=clamp(1-p.age/.62,0,1)*(1-i/7);
  ctx.globalAlpha=a*.75;ctx.fillStyle=palette.core;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.1,3.5-i*.42),0,TAU);ctx.fill()
 }
 ctx.restore()
}
function drawTrail(){
 ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
 for(const e of trailEchoes){const a=clamp(e.life/e.max,0,1);if(!smoothPath(ctx,e.points))continue;ctx.globalAlpha=a;ctx.shadowBlur=18*a;ctx.shadowColor=e.color;ctx.strokeStyle=e.color;ctx.lineWidth=5*a+1;ctx.stroke()}
 ctx.globalAlpha=1;
 const visualTrail=getTrailVisualPoints();
 if(activeTrail&&visualTrail.length>1){
  const risk=1+Math.min(2.8,trailCells.length/125),hot=clamp((risk-1)/2.8,0,1),color=hot>.72?"#ffc75f":"#ff63ce";
  if(smoothPath(ctx,visualTrail)){
   ctx.shadowBlur=21;ctx.shadowColor=color;ctx.strokeStyle="rgba(255,74,198,.22)";ctx.lineWidth=10+hot*3;ctx.stroke();
   smoothPath(ctx,visualTrail);ctx.shadowBlur=10;ctx.strokeStyle=color;ctx.lineWidth=4.1+hot;ctx.stroke();
   smoothPath(ctx,visualTrail);ctx.shadowBlur=0;ctx.strokeStyle=`rgba(255,255,255,${.55+hot*.35})`;ctx.lineWidth=1.1;ctx.stroke()
  }
 }
 ctx.restore()
}
'''

          text = re.sub(
              r'function drawTrail\(\)\{.*?\}\n(?=function drawNodes)',
              wake_and_trail,
              text,
              count=1,
              flags=re.S,
          )

          draw_nodes = r'''function drawNodes(){
 for(const n of nodes){
  ctx.save();ctx.translate(n.x,n.y);
  const stable=n.status==="stabilized",queued=n.status==="queued",inc=n.status==="incursion",lost=n.status==="lost";
  const pulse=lost?1:1+Math.sin(n.phase)*.08;
  ctx.globalAlpha=lost?.42:(stable||inc?1:.78);
  ctx.strokeStyle=lost?"#6d667d":queued?"#ffc75f":n.type.color;
  ctx.lineWidth=stable?2.2:queued||inc?1.8:1.2;
  ctx.shadowBlur=lost?0:stable||inc?22:queued?17:10;
  ctx.shadowColor=ctx.strokeStyle;
  if(lost){
   ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(0,0,n.r*pulse,-Math.PI*.15,Math.PI*.62);ctx.stroke();ctx.beginPath();ctx.arc(0,0,n.r*pulse,Math.PI*.84,Math.PI*1.7);ctx.stroke();ctx.setLineDash([])
  }else{ctx.beginPath();ctx.arc(0,0,n.r*pulse,0,TAU);ctx.stroke()}
  ctx.rotate(Math.PI/4);ctx.fillStyle=stable?n.type.color:"rgba(255,255,255,.035)";ctx.strokeRect(-8,-8,16,16);if(stable)ctx.fillRect(-5,-5,10,10);ctx.rotate(-Math.PI/4);
  ctx.shadowBlur=0;ctx.textAlign="center";ctx.textBaseline="middle";
  if(lost){ctx.strokeStyle="#ff688f";ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(4,4);ctx.moveTo(4,-4);ctx.lineTo(-4,4);ctx.stroke()}
  else{ctx.fillStyle="#fff";ctx.font="900 9px Inter,system-ui";ctx.fillText(n.type.short,0,0)}
  ctx.restore()
 }
}
'''

          text = re.sub(
              r'function drawNodes\(\)\{.*?\}\n(?=function drawEnemies)',
              draw_nodes,
              text,
              count=1,
              flags=re.S,
          )

          # Age/sample the wake in both normal gameplay and incursions.
          text = text.replace(
              'if(incursion.active){updateIncursion(dt);return}',
              'if(incursion.active){updateIncursion(dt);updatePlayerWake(dt);return}',
              1,
          )
          text = text.replace(
              'updatePlayer(dt);updateEnemies(dt);',
              'updatePlayer(dt);updatePlayerWake(dt);updateEnemies(dt);',
              1,
          )

          # Draw wake below the cut trail and the player.
          text = text.replace(
              'drawNodes();drawPortal();drawSpores();drawTrail();drawAnchor();',
              'drawNodes();drawPortal();drawSpores();drawPlayerWake();drawTrail();drawAnchor();',
              1,
          )

          target.write_text(text, encoding="utf-8")

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('void-cutter/void_cutter_resonance_v4.html').read_text(encoding='utf-8')
          match = re.search(r'<script>([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit('Script block not found')
          Path('/tmp/void-cutter-v4.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/void-cutter-v4.js

      - name: Commit V4
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add void-cutter/void_cutter_resonance_v4.html
          git commit -m "Add Void Cutter V4 with persistent lost nodes and polished wake"
          git push origin HEAD:void-cutter-v3-preview
